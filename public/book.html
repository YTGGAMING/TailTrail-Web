<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tail Trail - Book a Walk</title>
    <style>
        :root {
            --primary: #FF8A00;
            --dark: #121212;
            --light: #F8F9FA;
            --grey: #242424;
            --text-muted: #A0A0A0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--dark); color: var(--light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: var(--grey); padding: 30px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid #333; margin-top: 20px; }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; text-align: center; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: var(--light); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { background: #1a1a1a; border: 1px solid #444; padding: 12px 15px; border-radius: 8px; color: var(--light); font-size: 1rem; transition: all 0.3s ease; width: 100%; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 8px rgba(255, 138, 0, 0.2); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background: #e07a00; }
        .btn-submit:active { transform: scale(0.98); }
        .nav-link { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .nav-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Book a Session 🐾</h1>
        <p class="subtitle">Fill out the matrix to calculate rates and set up your schedule workflow.</p>
        
        <form id="bookingForm">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dogName">Dog's Name</label>
                    <input type="text" id="dogName" required placeholder="e.g., Max">
                </div>
                <div class="form-group">
                    <label for="breed">Dog's Breed</label>
                    <input type="text" id="breed" required placeholder="e.g., Golden Retriever">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="size">Dog's Size Category</label>
                    <select id="size" required>
                        <option value="small">Small (e.g., Puppy, Pomeranian)</option>
                        <option value="medium">Medium (e.g., Husky, Boxer)</option>
                        <option value="large">Large (e.g., German Shepherd, Great Dane)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="orderType">Order Structure</label>
                    <select id="orderType" required>
                        <option value="single">Single Walk Session</option>
                        <option value="subscription">Weekly Subscription Plan</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="walkDuration">Base Duration</label>
                    <select id="walkDuration" required>
                        <option value="30">30 Minutes</option>
                        <option value="60">1 Hour</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="extraTime">Add Overtime Window</label>
                    <select id="extraTime" required>
                        <option value="0">No Extra Time</option>
                        <option value="1">+30 Minutes (+50 EGP)</option>
                        <option value="2">+60 Minutes (+100 EGP)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="walkDate">Scheduled Date</label>
                    <input type="date" id="walkDate" required>
                </div>
                <div class="form-group">
                    <label for="pickupTime">Pickup Time Window</label>
                    <input type="time" id="pickupTime" required>
                </div>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Options (Settled AFTER Walk)</label>
                <select id="paymentMethod" required>
                    <option value="Cash">💵 Cash</option>
                    <option value="Instapay">📱 Instapay</option>
                    <option value="Telda">💳 Telda</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Submit Request & Open WhatsApp</button>
        </form>
        
        <center><a href="/index.html" class="nav-link">← Return back to Main Console</a></center>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // CRITICAL: Stop the page from exploding into raw JSON text screen!

            // Package the full data payload matrix
            const formData = {
                dogName: document.getElementById('dogName').value,
                breed: document.getElementById('breed').value,
                size: document.getElementById('size').value,
                orderType: document.getElementById('orderType').value,
                walkDuration: document.getElementById('walkDuration').value,
                extraTime: document.getElementById('extraTime').value,
                walkDate: document.getElementById('walkDate').value,
                pickupTime: document.getElementById('pickupTime').value,
                paymentMethod: document.getElementById('paymentMethod').value // Grabs your selected option live
            };

            try {
                // Post data silently to the server route background pipeline
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.status === 401) {
                    alert("Unauthorized access! Please clear your cookie profiles, log out, and register a fresh account.");
                    window.location.href = "/index.html";
                    return;
                }

                const data = await response.json();

                if (data.success && data.whatsappUrl) {
                    // THE REDIRECT SOLUTION: Forces current window layer straight into WhatsApp cleanly!
                    window.location.href = data.whatsappUrl;
                } else {
                    alert("System matrix error: " + (data.error || "Could not process booking."));
                }
            } catch (err) {
                console.error("Networking error:", err);
                alert("Connection matrix broken. Check backend log channels.");
            }
        });
    </script>
</body>
</html>
