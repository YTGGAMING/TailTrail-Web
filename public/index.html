<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tail Trail | Dog Walking Matrix</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --danger-color: #ff4d4d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .review-box {
            background-color: var(--card-bg);
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #0d0f12;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .review-card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            position: relative;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .review-name {
            font-weight: bold;
            color: var(--accent-color);
        }
        .review-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .review-text {
            line-height: 1.5;
        }
        .btn-delete {
            background-color: var(--danger-color);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 10px;
            display: none; /* Controlled dynamically by auth script matrix */
        }
        .btn-delete:hover {
            background-color: #cc0000;
        }
        .auth-banner {
            background-color: #1f1515;
            border: 1px solid #dc3545;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 Tail Trail Review Board Matrix 🐾</h1>
        <div id="auth-status" class="auth-banner">Checking secure session status...</div>

        <div class="review-box">
            <h2>Leave a Feed Matrix Review</h2>
            <form action="/api/reviews" method="POST" id="review-form">
                <div class="form-group">
                    <label for="review-name">Display Name:</label>
                    <input type="text" id="review-name" name="name" required placeholder="Your display name">
                </div>
                <div class="form-group">
                    <label for="review-text">Your Review:</label>
                    <textarea id="review-text" name="text" required placeholder="Type your experience here..."></textarea>
                </div>
                <button type="submit" class="btn">Submit Live Review</button>
            </form>
        </div>

        <h2>Live Reviews Feed</h2>
        <div id="reviews-container">Loading latest database records...</div>
    </div>

    <script>
        let currentUserMatrix = null;
        let isAdminMatrix = false;

        // 1. ASYNC CHECK: Verify exact session logs on page wake
        async function checkUserSession() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const authBanner = document.getElementById('auth-status');
                const inputName = document.getElementById('review-name');
                
                if (data.loggedIn) {
                    currentUserMatrix = data.user;
                    isAdminMatrix = data.isAdmin;
                    authBanner.innerHTML = `🟢 Logged in as: <strong>${currentUserMatrix.displayName}</strong> (@${currentUserMatrix.username}) ${isAdminMatrix ? '[ADMIN]' : ''}`;
                    authBanner.style.backgroundColor = '#151f17';
                    authBanner.style.borderColor = '#28a745';
                    
                    // Auto-fill and lock name field to prevent spoofing database records
                    if (inputName) {
                        inputName.value = currentUserMatrix.displayName;
                        inputName.setAttribute('readonly', true);
                    }
                } else {
                    authBanner.innerHTML = `🔴 Browsing as Guest. Log in to manage bookings or unlock deletion options.`;
                    authBanner.style.backgroundColor = '#1c1c1c';
                    authBanner.style.borderColor = '#444';
                }
            } catch (err) {
                console.error("Session verification system failed:", err);
            }
            // Fetch reviews immediately after session logic drops
            fetchReviewsMatrix();
        }

        // 2. ASYNC FETCH: Render permanent Postgres records to the display screen
        async function fetchReviewsMatrix() {
            const container = document.getElementById('reviews-container');
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();
                
                if (reviews.length === 0) {
                    container.innerHTML = `<p style="color: var(--text-muted);">No reviews posted to the database yet, fr.</p>`;
                    return;
                }
                
                container.innerHTML = ''; // Wipe loading placeholder text
                
                reviews.forEach(review => {
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    
                    // FIXED: Check if current profile username or display name matches the target entry
                    // Admin mode overrides identity checks completely to grant deletion privilege
                    const canDelete = isAdminMatrix || (currentUserMatrix && currentUserMatrix.displayName === review.name);
                    
                    card.innerHTML = `
                        <div class="review-header">
                            <span class="review-name">${escapeHTML(review.name)}</span>
                            <span class="review-date">${review.date}</span>
                        </div>
                        <div class="review-text">${escapeHTML(review.text)}</div>
                        <button class="btn-delete" 
                                style="display: ${canDelete ? 'block' : 'none'}" 
                                onclick="fireDeleteRoute('${escapeJS(review.name)}', '${escapeJS(review.text)}')">
                            Delete Review
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<p style="color: var(--danger-color);">Error fetching live records from Postgres matrix.</p>`;
            }
        }

        // 3. ASYNC DELETE ENGINE: Pass explicit JSON blocks directly to backend server checkpoints
        async function fireDeleteRoute(reviewName, reviewText) {
            if (!confirm("Are u sure u want to wipe this review from the server history forever?")) return;

            try {
                // FIXED: We pass the exact strings straight into the request payload matrix
                const response = await fetch('/api/reviews/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: reviewName, 
                        text: reviewText 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Instantly sync UI with the database matrix
                    fetchReviewsMatrix(); 
                } else {
                    alert(`System Halt: ${result.error || "Could not execute wipe protocol."}`);
                }
            } catch (err) {
                alert("Network error: Failed to connect to server deletion endpoint.");
            }
        }

        // Security sanitization helper scripts to prevent injection crashes
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function escapeJS(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
        }

        // Initialize script suite on page wake sequence
        window.onload = checkUserSession;
    </script>
</body>
</html>
